name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Self-tests
        run: |
          npm run test:chat-media-url
          npm run test:chat-message-content
          npm run test:link-preview

  e2e:
    name: Playwright (desktop + mobile + isolated API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  client:
    name: Client (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test tooling and Chromium
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      # Covers tsconfig.spec.json, which the app typecheck above does not reach.
      # A type error here previously broke the whole Karma run with a single
      # "load error" and zero tests executed, so this must stay a hard gate.
      - name: Test
        working-directory: .
        run: npm run test:client

      - name: Build
        run: npm run build
