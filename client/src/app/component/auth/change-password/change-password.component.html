<div class="auth-shell">
  <h2 class="auth-heading">Set a new password</h2>

  <div class="auth-card">
    <app-error-alert [message]="errorMessage" variant="inline" *ngIf="errorMessage" />

    <form [formGroup]="setNewPassForm" (ngSubmit)="onSubmit()" class="flex flex-col">
      <div class="auth-field">
        <label for="password" class="auth-label">New password</label>
        <input
          type="password"
          id="password"
          formControlName="newPassword"
          class="auth-input"
          autocomplete="new-password"
          required
        />
        <p
          *ngIf="
            setNewPassForm.get('newPassword')?.invalid &&
            (setNewPassForm.get('newPassword')?.touched || setNewPassForm.get('newPassword')?.dirty)
          "
          class="auth-error"
        >
          <span *ngIf="setNewPassForm.get('newPassword')?.errors?.['required']">Password is required</span>
          <span *ngIf="setNewPassForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </p>
      </div>

      <div class="auth-field">
        <label for="confirmPassword" class="auth-label">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="auth-input"
          autocomplete="new-password"
          required
        />
        <p
          *ngIf="
            setNewPassForm.get('confirmPassword')?.invalid &&
            (setNewPassForm.get('confirmPassword')?.touched || setNewPassForm.get('confirmPassword')?.dirty)
          "
          class="auth-error"
        >
          <span *ngIf="setNewPassForm.get('confirmPassword')?.errors?.['required']">Confirm your password</span>
          <span *ngIf="setNewPassForm.get('confirmPassword')?.errors?.['mismatch']">Passwords do not match</span>
        </p>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="setNewPassForm.invalid"
      >
        Save password
      </app-button>
    </form>
  </div>
</div>
