<div class="auth-shell">
  <h2 class="auth-heading">Verify your email</h2>

  <div class="auth-card">
    <app-error-alert [message]="errorMessage" variant="inline" *ngIf="errorMessage" />

    <form [formGroup]="emailVerifyForm" (ngSubmit)="onSubmit()" class="flex flex-col">
      <div class="auth-field">
        <label for="email" class="auth-label">Email</label>
        <input formControlName="email" type="email" id="email" class="auth-input" autocomplete="email" />
        <p
          *ngIf="
            emailVerifyForm.get('email')?.invalid &&
            (emailVerifyForm.get('email')?.touched || emailVerifyForm.get('email')?.dirty)
          "
          class="auth-error"
        >
          <span *ngIf="emailVerifyForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="emailVerifyForm.get('email')?.errors?.['email']">Enter a valid email address</span>
        </p>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="emailVerifyForm.invalid"
      >
        Send code
      </app-button>

      <p class="auth-foot">
        Remember your password?
        <a routerLink="/auth/login" class="auth-link">Log in</a>
      </p>
    </form>
  </div>
</div>
