<div class="auth-shell">
  <h2 class="auth-heading">Welcome back</h2>

  <div class="auth-card">
    <app-error-alert [message]="errorMessage" variant="inline" *ngIf="errorMessage" />

    <form [formGroup]="loginForm" class="flex flex-col" (ngSubmit)="onLogin()">
      <div class="auth-field">
        <label for="email" class="auth-label">Email</label>
        <input formControlName="email" type="email" id="email" class="auth-input" autocomplete="email" required />
        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="auth-error">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email address</span>
        </p>
      </div>

      <div class="auth-field">
        <label for="password" class="auth-label">Password</label>
        <input formControlName="password" type="password" id="password" class="auth-input" autocomplete="current-password" required />
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="auth-error">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </p>
        <a
          [routerLink]="['/auth/email_verify']"
          [queryParams]="{ mode: 'forgot-password' }"
          class="auth-link mt-2 inline-block text-xs"
        >
          Forgot your password?
        </a>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="loginForm.invalid"
      >
        Log in
      </app-button>

      <p class="auth-foot">
        Don't have an account?
        <a routerLink="/auth/email_verify" class="auth-link">Sign up</a>
      </p>
    </form>
  </div>
</div>
