<div class="auth-shell">
  <h2 class="auth-heading">Enter your code</h2>

  <div class="auth-card">
    <app-error-alert [message]="errorMessage" variant="inline" *ngIf="errorMessage" />

    <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="flex flex-col">
      <div class="auth-field">
        <label for="otp" class="auth-label">6-digit code</label>
        <input
          type="text"
          id="otp"
          formControlName="otp"
          class="auth-input text-center text-lg tracking-[0.4em]"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          required
        />
        <p
          *ngIf="otpForm.get('otp')?.invalid && (otpForm.get('otp')?.touched || otpForm.get('otp')?.dirty)"
          class="auth-error"
        >
          <span *ngIf="otpForm.get('otp')?.errors?.['required']">Enter the code we sent you</span>
          <span *ngIf="otpForm.get('otp')?.errors?.['minlength']">The code is 6 digits</span>
        </p>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="otpForm.invalid"
      >
        Verify
      </app-button>

      <app-button
        type="button"
        variant="ghost"
        size="sm"
        [block]="true"
        [disabled]="countdown > 0 || isResending"
        extraClass="mt-2"
        (click)="resendOtp()"
      >
        <ng-container *ngIf="isResending; else resendLabel">Sending…</ng-container>
        <ng-template #resendLabel>
          Resend code<span *ngIf="countdown > 0"> in {{ countdown }}s</span>
        </ng-template>
      </app-button>

      <p class="auth-foot">
        Remember your password?
        <a routerLink="/auth/login" class="auth-link">Log in</a>
      </p>
    </form>
  </div>
</div>
