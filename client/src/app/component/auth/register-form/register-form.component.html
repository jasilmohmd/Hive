<div class="auth-shell">
  <h2 class="auth-heading">Create account</h2>

  <div class="auth-card">
    <app-error-alert [message]="errorMessage" variant="inline" *ngIf="errorMessage" />

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="flex flex-col">
      <div class="auth-field">
        <label for="username" class="auth-label">Username</label>
        <input formControlName="userName" type="text" id="username" class="auth-input" autocomplete="username" />
        <p *ngIf="registerForm.get('userName')?.invalid && registerForm.get('userName')?.touched" class="auth-error">
          Username is required
        </p>
      </div>

      <div class="auth-field">
        <label for="password" class="auth-label">Password</label>
        <input formControlName="password" type="password" id="password" class="auth-input" autocomplete="new-password" />
        <p *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="auth-error">
          Password must be at least 6 characters
        </p>
      </div>

      <div class="auth-field">
        <label for="confirm-password" class="auth-label">Confirm password</label>
        <input formControlName="confirmPassword" type="password" id="confirm-password" class="auth-input" autocomplete="new-password" />
        <p
          *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched"
          class="auth-error"
        >
          Passwords do not match
        </p>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="registerForm.invalid"
      >
        Continue
      </app-button>

      <p class="auth-foot">
        Already have an account?
        <a routerLink="/auth/login" class="auth-link">Log in</a>
      </p>
    </form>
  </div>
</div>
