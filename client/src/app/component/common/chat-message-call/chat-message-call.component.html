<div
  class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs"
  [ngClass]="
    missed
      ? 'border-danger/40 bg-danger/10 text-danger-text'
      : 'border-surface-600/60 bg-surface-800/80 text-ink-secondary'
  "
>
  <span aria-hidden="true" class="text-sm">{{ isVideo ? '📹' : '📞' }}</span>
  <span>{{ label }}</span>
</div>
