<a
  [href]="mapsLink"
  target="_blank"
  rel="noopener noreferrer"
  class="block max-w-xs overflow-hidden rounded-lg border border-surface-600/50 bg-surface-900/40 transition-colors hover:border-success/50"
>
  <img
    [src]="mapImageUrl"
    [alt]="displayLabel"
    class="h-28 w-full object-cover"
    loading="lazy"
  />
  <span class="flex items-center justify-between gap-2 px-3 py-2 text-sm">
    <span class="truncate font-medium">{{ displayLabel }}</span>
    <span class="shrink-0 text-xs text-success">Open in Maps</span>
  </span>
</a>
