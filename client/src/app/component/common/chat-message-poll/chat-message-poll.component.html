<div class="max-w-sm space-y-2 sm:min-w-[14rem]">
  <p class="text-sm font-medium">{{ poll.question }}</p>
  <div class="space-y-1.5">
    <button
      *ngFor="let opt of poll.options; let i = index"
      type="button"
      class="flex w-full flex-col rounded-lg border px-3 py-2 text-left text-sm transition-colors"
      [ngClass]="isSelected(i) ? 'border-brand bg-brand/10' : 'border-surface-600'"
      [disabled]="poll.myVotes.length > 0"
      (click)="toggleOption(i)"
    >
      <span class="flex justify-between gap-2">
        <span>{{ opt }}</span>
        <span *ngIf="poll.myVotes.length > 0" class="text-xs text-ink-secondary">{{ percent(poll.counts[i]) }}%</span>
      </span>
      <span *ngIf="poll.myVotes.length > 0" class="mt-1 block h-1 overflow-hidden rounded-full bg-surface-700">
        <span class="block h-full bg-brand" [style.width]="percent(poll.counts[i]) + '%'"></span>
      </span>
    </button>
  </div>
  <app-button *ngIf="poll.myVotes.length === 0" variant="primary" size="sm" [block]="true"
        [disabled]="!selected.size" (click)="submitVote()">Vote</app-button>
  <p *ngIf="poll.myVotes.length > 0" class="text-xs text-ink-muted">{{ totalVotes() }} vote(s)</p>
</div>
