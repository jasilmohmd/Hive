<div
  class="fixed inset-0 z-40 bg-surface-950/40 sm:absolute sm:inset-auto sm:bottom-full sm:left-0 sm:right-0 sm:mb-2 sm:bg-transparent"
  (click)="dismiss.emit()"
  role="presentation"
>
  <div
    class="absolute bottom-0 left-0 right-0 rounded-t-2xl border border-surface-700 pb-[var(--safe-bottom)] shadow-xl sm:relative sm:rounded-2xl sm:pb-0"
    [ngClass]="[themeClasses, panelClass]"
    (click)="$event.stopPropagation()"
  >
    <div
      *ngIf="sheetTitle"
      class="flex items-center justify-between border-b border-surface-700 px-3 py-2"
    >
      <span class="text-sm font-medium">{{ sheetTitle }}</span>
      <button
        type="button"
        class="-my-1 rounded-lg px-3 py-2 text-sm text-ink-secondary hover:bg-surface-850 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
        (click)="dismiss.emit()"
      >
        Close
      </button>
    </div>

    <ng-content></ng-content>
  </div>
</div>
