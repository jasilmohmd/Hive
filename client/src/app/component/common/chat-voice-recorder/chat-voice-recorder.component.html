<app-chat-sheet [theme]="theme" panelClass="p-4" (dismiss)="dismiss.emit()">
  <p class="mb-3 text-sm text-ink-secondary">Record a voice message (max 60s)</p>
  <p *ngIf="error" class="mb-2 text-sm text-danger-text">{{ error }}</p>
  <!--
    Emphasis was inverted: "Stop & send" is the action that actually commits the
    message, but it was the quiet secondary button while "Start recording" was
    the loud one. Red stays on Start — that reads as the record convention, not
    as a destructive warning — and Stop & send is now primary.
  -->
  <div class="flex items-center gap-2">
    <app-button
      *ngIf="!recording"
      variant="danger"
      size="md"
      extraClass="flex-1"
      (click)="startRecording()"
    >
      <span class="mr-0.5 inline-block h-2.5 w-2.5 rounded-full bg-white" aria-hidden="true"></span>
      Start recording
    </app-button>
    <app-button
      *ngIf="recording"
      variant="primary"
      size="md"
      extraClass="flex-1"
      (click)="stopRecording()"
    >
      Stop &amp; send
    </app-button>
    <app-button variant="outline" size="md" (click)="dismiss.emit()">Cancel</app-button>
  </div>
</app-chat-sheet>
