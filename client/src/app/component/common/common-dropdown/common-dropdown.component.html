<!-- Dropdown Toggle Button -->
<button
  type="button"
  (click)="toggle($event)"
  aria-haspopup="menu"
  [attr.aria-expanded]="isOpen"
  [attr.aria-label]="label"
  class="flex h-10 w-10 items-center justify-center bg-surface-950 hover:bg-surface-600 text-sm rounded-full focus-visible:ring-2 focus-visible:ring-brand"
>
  <img src="assets/Icons/menu-vertical.png" alt="" class="w-6 h-6">
</button>
<!-- Dropdown Menu -->
<div *ngIf="isOpen" role="menu" class="absolute right-0 mt-2 w-44 overflow-hidden rounded-lg bg-surface-800 py-1 shadow-lg ring-1 ring-surface-700 z-50">
  <button
    *ngFor="let item of items"
    type="button"
    role="menuitem"
    (click)="selectItem(item, $event)"
    [ngClass]="item.class"
    class="flex min-h-10 w-full items-center gap-2 px-4 py-2 text-left text-sm text-ink hover:bg-surface-700 focus-visible:bg-surface-700 focus-visible:outline-none"
  >
    <!-- Conditionally display icon -->
    <ng-container *ngIf="(item.display || 'both') !== 'label'">
      <img *ngIf="item.icon" [src]="item.icon" alt="" class="w-5 h-5 shrink-0">
    </ng-container>
    <!-- Conditionally display label -->
    <ng-container *ngIf="(item.display || 'both') !== 'icon'">
      <span class="min-w-0 truncate">{{ item.label }}</span>
    </ng-container>
  </button>
</div>
