<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-950/50 p-4 animate-fadeIn"
  (click)="onBackdropClick($event)"
  role="presentation"
>
  <div
    #panel
    class="relative w-full max-w-sm rounded-lg bg-surface-900 p-6 text-ink shadow-xl ring-1 ring-surface-700"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? titleId : null"
    [attr.aria-describedby]="message ? messageId : null"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <h2 *ngIf="title" [id]="titleId" class="mb-4 text-xl font-bold">{{ title }}</h2>
    <p *ngIf="message" [id]="messageId" class="mb-6 text-ink-secondary">{{ message }}</p>
    <div class="flex justify-end space-x-2">
      <app-button variant="secondary" [disabled]="loading" (click)="cancel()">{{ cancelText || 'Cancel' }}</app-button>
      <app-button [variant]="confirmVariant" [loading]="loading" [disabled]="loading" (click)="confirm()">{{ confirmText || 'Confirm' }}</app-button>
    </div>
  </div>
</div>
