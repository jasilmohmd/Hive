<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-950/50 p-4 animate-fadeIn"
  (click)="onBackdropClick($event)"
  role="presentation"
>
  <div
    #panel
    class="relative w-full max-w-sm rounded-lg bg-surface-900 p-6 text-ink shadow-xl ring-1 ring-surface-700"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? titleId : null"
    [attr.aria-describedby]="message ? messageId : null"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <h2 *ngIf="title" [id]="titleId" class="mb-4 text-xl font-bold">{{ title }}</h2>
    <p *ngIf="message" [id]="messageId" class="mb-6 text-ink-secondary">{{ message }}</p>
    <div *ngIf="confirmPhrase" class="mb-6">
      <label class="mb-1 block text-sm text-ink-secondary">
        Type <span class="font-semibold text-ink">{{ confirmPhrase }}</span> to confirm
      </label>
      <input
        type="text"
        [(ngModel)]="typed"
        class="w-full rounded-md border border-surface-700 bg-surface-950 px-3 py-2 text-ink focus:border-brand focus:outline-none"
        autocomplete="off"
      />
    </div>
    <div class="flex justify-end space-x-2">
      <app-button variant="secondary" [disabled]="loading" (click)="cancel()">{{ cancelText || 'Cancel' }}</app-button>
      <app-button [variant]="confirmVariant" [loading]="loading" [disabled]="confirmDisabled" (click)="confirm()">{{ confirmText || 'Confirm' }}</app-button>
    </div>
  </div>
</div>
