<!--
  Two renderings of the same rows:

  - Below sm, a stacked card list. A real table on a phone could only scroll
    sideways, which pushed the action buttons (Accept / Remove / …) off screen.
    Each card is avatar + primary text + the remaining columns as muted lines,
    with the actions wrapping under the text when they don't fit beside it.
  - From sm, the table. overflow-x-auto still guards against unexpectedly wide
    content; the fixed column widths only apply from md.

  The avatar and the actions are shared templates, so the two views can't drift.
-->

<ng-template #avatarTpl let-row>
  <ng-container *ngIf="row.profilePicture || row.imageUrl; else fallback">
    <img
      [src]="row.profilePicture || row.imageUrl"
      [alt]="row.userName || row.name || row.email || 'User'"
      class="h-10 w-10 shrink-0 rounded-full object-cover"
      [ngClass]="{ 'ring-1 ring-white/10': appearance === 'friends' }"
    />
  </ng-container>
  <ng-template #fallback>
    <div
      *ngIf="showFallbackInitial"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-surface-600 text-base font-medium md:text-lg"
      [ngClass]="{ 'ring-1 ring-white/10': appearance === 'friends' }"
      aria-hidden="true"
    >
      {{ initial(row) }}
    </div>
  </ng-template>
</ng-template>

<ng-template #badgesTpl let-badges>
  <div class="flex flex-wrap gap-1">
    <span *ngFor="let badge of badges"
      class="rounded-full px-2 py-0.5 text-xs font-medium"
      [ngClass]="badge.class || 'bg-surface-700 text-ink-secondary'">
      {{ badge.label }}
    </span>
    <span *ngIf="!badges?.length" class="text-xs text-ink-muted">—</span>
  </div>
</ng-template>

<ng-template #actionsTpl let-row>
  <ng-container *ngFor="let act of primaryActions">
    <button
      *ngIf="!act.hidden || !act.hidden(row)"
      type="button"
      (click)="act.action(row); $event.stopPropagation()"
      [disabled]="isDisabled(act, row)"
      [ngClass]="[act.class || '', actionBaseClasses(act)]"
      class="inline-flex min-h-9 min-w-9 shrink-0 items-center justify-center whitespace-nowrap rounded-md p-1.5 transition-colors focus-visible:ring-2 focus-visible:ring-brand disabled:cursor-not-allowed disabled:opacity-60 coarse:min-h-10 coarse:min-w-10"
      [title]="labelOf(act, row)"
      [attr.aria-label]="act.icon ? labelOf(act, row) : null"
    >
      <img *ngIf="act.icon" [src]="act.icon" alt="" class="h-5 w-5" />
      <span *ngIf="!act.icon">{{ labelOf(act, row) }}</span>
    </button>
  </ng-container>

  <div class="dropdown-container relative shrink-0" *ngIf="secondaryActions?.length">
    <app-common-dropdown
      [items]="secondaryActions"
      [isOpen]="dropdownOpen === row"
      (isOpenChange)="dropdownOpen = $event ? row : null"
      (itemSelected)="onSecondaryAction($event, row)"
    >
    </app-common-dropdown>
  </div>
</ng-template>

<!-- ─────────────── Phones: stacked cards ─────────────── -->
<ul class="flex flex-col gap-2 sm:hidden" [attr.aria-label]="ariaLabel">
  <li
    *ngFor="let row of data"
    class="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-xl p-2 transition-colors"
    [ngClass]="appearance === 'friends'
      ? 'border border-surface-800/80 bg-surface-950/30'
      : 'bg-surface-900/50'"
    [class.cursor-pointer]="enableRowClick"
    [attr.tabindex]="enableRowClick ? 0 : null"
    [attr.role]="enableRowClick ? 'button' : null"
    (click)="onCardActivate($event, row)"
    (keydown.enter)="onCardActivate($event, row)"
  >
    <div class="flex min-w-0 flex-1 basis-40 items-center gap-3">
      <ng-container *ngIf="hasAvatarColumn">
        <ng-container *ngTemplateOutlet="avatarTpl; context: { $implicit: row }"></ng-container>
      </ng-container>
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <ng-container *ngFor="let col of dataColumns; let first = first">
          <ng-container [ngSwitch]="col.field">
            <ng-container *ngSwitchCase="'roleBadges'">
              <ng-container *ngTemplateOutlet="badgesTpl; context: { $implicit: row[col.field] }"></ng-container>
            </ng-container>
            <span *ngSwitchDefault
              class="min-w-0 truncate"
              [ngClass]="first ? 'font-medium text-ink' : 'text-xs text-ink-muted'"
              [title]="row[col.field] ?? ''">
              {{ row[col.field] }}
            </span>
          </ng-container>
        </ng-container>
      </div>
    </div>
    <div class="ml-auto flex shrink-0 flex-wrap items-center justify-end gap-1.5">
      <ng-container *ngTemplateOutlet="actionsTpl; context: { $implicit: row }"></ng-container>
    </div>
  </li>
</ul>

<!-- ─────────────── sm+: table ─────────────── -->
<div
  class="hidden overflow-x-auto sm:block"
  [ngClass]="
    appearance === 'friends'
      ? 'rounded-xl border border-surface-800/80 bg-surface-950/30'
      : ''
  "
>
  <div class="min-w-full">
    <table
      class="w-full"
      [class.friends-data-tight]="appearance === 'friends'"
      [attr.aria-label]="ariaLabel"
    >
      <thead *ngIf="showColumnHeaders">
        <tr
          [ngClass]="
            appearance === 'friends'
              ? 'border-b border-surface-800 bg-surface-800/40'
              : 'border-b border-surface-700'
          "
        >
          <ng-container *ngFor="let col of columns">
            <!--
              The width moved into ngClass rather than [class.w-[200px]]:
              square brackets inside a class-binding attribute name are fragile
              to parse, and an array ngClass expresses "base classes plus a
              conditional one" without that hazard.
            -->
            <th
              [ngClass]="[
                appearance === 'friends'
                  ? 'px-2 py-2 text-left text-sm font-thin text-ink-secondary sm:px-4 sm:py-2.5'
                  : 'px-2 py-2 text-left text-sm font-thin text-ink-secondary md:px-4',
                col.field === 'profilePicture' ? 'md:w-[200px]' : ''
              ]"
            >
              {{ col.header }}
            </th>
          </ng-container>
          <th
            [ngClass]="
              appearance === 'friends'
                ? 'px-2 py-2 text-right text-sm font-thin text-ink-secondary sm:px-4 sm:py-2.5 md:w-[120px]'
                : 'px-2 py-2 text-right text-sm font-thin text-ink-secondary md:w-[120px] md:px-4'
            "
          ><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let row of data"
          class="transition-colors hover:bg-surface-900/50"
          [ngClass]="appearance === 'friends' ? 'border-b border-surface-800/80' : 'border-b border-surface-700'"
          [class.cursor-pointer]="enableRowClick"
          [attr.tabindex]="enableRowClick ? 0 : null"
          (click)="onRowActivate($event, row)"
          (keydown.enter)="onCardActivate($event, row)"
        >
          <ng-container *ngFor="let col of columns">
            <td
              [ngClass]="
                appearance === 'friends'
                  ? 'px-2 py-2 align-middle sm:px-4 sm:py-2.5'
                  : 'px-2 py-2 align-middle md:px-4'
              "
            >
              <ng-container [ngSwitch]="col.field">
                <div *ngSwitchCase="'profilePicture'" class="flex items-center">
                  <ng-container *ngTemplateOutlet="avatarTpl; context: { $implicit: row }"></ng-container>
                </div>

                <ng-container *ngSwitchCase="'roleBadges'">
                  <ng-container *ngTemplateOutlet="badgesTpl; context: { $implicit: row[col.field] }"></ng-container>
                </ng-container>

                <!-- max-w gives `truncate` something to truncate against: in a
                     table-layout:auto cell it would otherwise just widen. -->
                <div *ngSwitchDefault class="max-w-[12rem] truncate md:max-w-[20rem]" [title]="row[col.field] ?? ''">
                  {{ row[col.field] }}
                </div>
              </ng-container>
            </td>
          </ng-container>

          <td
            [ngClass]="
              appearance === 'friends'
                ? 'px-2 py-2 text-right align-middle sm:px-4 sm:py-2.5'
                : 'px-2 py-2 text-right align-middle md:px-4'
            "
          >
            <div class="flex flex-nowrap items-center justify-end gap-1 md:gap-2">
              <ng-container *ngTemplateOutlet="actionsTpl; context: { $implicit: row }"></ng-container>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<p *ngIf="emptyText && !data?.length" class="py-6 text-center text-sm text-ink-muted">{{ emptyText }}</p>
