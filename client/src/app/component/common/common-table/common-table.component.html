<!--
  The scroll container is the important part. This table carries fixed-width
  columns (a 200px avatar column, a 120px actions column) and previously had no
  overflow boundary at all, so in the community About modals - which on a phone
  render inside a chat pane of roughly 200px - it pushed the page rather than
  containing itself.

  overflow-x-auto means the table can never break the layout again; the widths
  themselves now only apply from md, where there is genuinely room for them.
-->
<div
  class="overflow-x-auto"
  [ngClass]="
    appearance === 'friends'
      ? 'rounded-xl border border-surface-800/80 bg-surface-950/30'
      : ''
  "
>
  <div class="min-w-full">
    <table
      class="w-full"
      [class.friends-data-tight]="appearance === 'friends'"
    >
      <thead *ngIf="showColumnHeaders">
        <tr
          [ngClass]="
            appearance === 'friends'
              ? 'border-b border-surface-800 bg-surface-800/40'
              : 'border-b border-surface-700'
          "
        >
          <ng-container *ngFor="let col of columns">
            <!--
              The width moved into ngClass rather than [class.w-[200px]]:
              square brackets inside a class-binding attribute name are fragile
              to parse, and an array ngClass expresses "base classes plus a
              conditional one" without that hazard.
            -->
            <th
              [ngClass]="[
                appearance === 'friends'
                  ? 'px-2 py-2 text-left text-sm font-thin text-ink-secondary sm:px-4 sm:py-2.5'
                  : 'px-2 py-2 text-left text-sm font-thin text-ink-secondary md:px-4',
                col.field === 'profilePicture' ? 'md:w-[200px]' : ''
              ]"
            >
              {{ col.header }}
            </th>
          </ng-container>
          <th
            [ngClass]="
              appearance === 'friends'
                ? 'px-2 py-2 text-right text-sm font-thin text-ink-secondary sm:px-4 sm:py-2.5 md:w-[120px]'
                : 'px-2 py-2 text-right text-sm font-thin text-ink-secondary md:w-[120px] md:px-4'
            "
          ></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let row of data"
          class="transition-colors hover:bg-surface-900/50"
          [ngClass]="appearance === 'friends' ? 'border-b border-surface-800/80' : 'border-b border-surface-700'"
          [class.cursor-pointer]="enableRowClick"
          (click)="onRowActivate($event, row)"
        >
          <ng-container *ngFor="let col of columns">
            <td
              [ngClass]="
                appearance === 'friends'
                  ? 'px-2 py-2 align-middle sm:px-4 sm:py-2.5'
                  : 'px-2 py-2 align-middle md:px-4'
              "
            >
              <ng-container [ngSwitch]="col.field">
                <div *ngSwitchCase="'profilePicture'" class="flex items-center">
                  <ng-container *ngIf="row.profilePicture || row.imageUrl; else fallback">
                    <img
                      [src]="row.profilePicture || row.imageUrl"
                      alt="{{ row.userName || row.name || row.email || 'User' }}"
                      class="h-8 w-8 shrink-0 rounded-full object-cover md:h-10 md:w-10"
                      [ngClass]="{ 'ring-1 ring-white/10': appearance === 'friends' }"
                    />
                  </ng-container>
                  <ng-template #fallback>
                    <ng-container *ngIf="showFallbackInitial">
                      <div
                        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-surface-600 text-base font-medium md:h-10 md:w-10 md:text-lg"
                        [ngClass]="{ 'ring-1 ring-white/10': appearance === 'friends' }"
                      >
                        {{
                          ((row.userName || row.name || row.email)
                            ? (row.userName || row.name || row.email)[0]
                            : '') | uppercase
                        }}
                      </div>
                    </ng-container>
                  </ng-template>
                </div>

                <!-- max-w gives `truncate` something to truncate against: in a
                     table-layout:auto cell it would otherwise just widen. -->
                <div *ngSwitchDefault class="max-w-[10rem] truncate md:max-w-none">
                  {{ row[col.field] }}
                </div>
              </ng-container>
            </td>
          </ng-container>

          <td
            [ngClass]="
              appearance === 'friends'
                ? 'px-2 py-2 text-right align-middle sm:px-4 sm:py-2.5'
                : 'px-2 py-2 text-right align-middle md:px-4'
            "
          >
            <div class="flex flex-nowrap items-center justify-end gap-1 md:gap-2">
              <ng-container *ngFor="let act of primaryActions">
                <button
                  *ngIf="!act.hidden || !act.hidden(row)"
                  type="button"
                  (click)="act.action(row); $event.stopPropagation()"
                  [ngClass]="act.class"
                  class="shrink-0 whitespace-nowrap rounded-md bg-surface-600 p-1.5 transition-colors"
                  [title]="act.label"
                >
                  <img *ngIf="act.icon" [src]="act.icon" alt="icon" class="h-5 w-5" />
                  <span *ngIf="!act.icon">{{ act.label }}</span>
                </button>
              </ng-container>

              <div class="dropdown-container relative shrink-0" *ngIf="secondaryActions?.length">
                <app-common-dropdown
                  [items]="secondaryActions"
                  [isOpen]="dropdownOpen === row"
                  (isOpenChange)="dropdownOpen = $event ? row : null"
                  (itemSelected)="onSecondaryAction($event, row)"
                >
                </app-common-dropdown>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
