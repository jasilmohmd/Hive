<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex flex-col bg-surface-950/95 backdrop-blur-sm"
  role="dialog"
  aria-label="Voice or video call"
>
  <div class="flex min-h-0 flex-1 flex-col items-center justify-center gap-3 p-4 pt-[max(1rem,env(safe-area-inset-top))] sm:gap-4 sm:p-6 short:gap-2 short:p-2">
    <p class="max-w-full truncate text-lg font-medium text-ink">{{ peerName }}</p>
    <p
      class="text-center text-sm"
      [class.text-ink-secondary]="callState !== 'unavailable'"
      [class.text-brand]="callState === 'unavailable'"
    >
      <ng-container *ngIf="callState === 'incoming'; else callStatus">
        Incoming {{ callType === 'video' ? 'video' : 'voice' }} call — use the dialog to answer
      </ng-container>
      <ng-template #callStatus>{{ statusLabel() }}</ng-template>
    </p>

    <!-- Always in DOM so voice calls can play remote audio (video element is video-only in template) -->
    <audio #remoteAudio autoplay playsinline class="remote-call-audio"></audio>

    <div
      class="relative flex min-h-0 w-full max-w-3xl flex-1 items-center justify-center overflow-hidden rounded-2xl bg-surface-900"
    >
      <video
        #remoteVideo
        *ngIf="callType === 'video'"
        class="h-full w-full object-contain"
        autoplay
        playsinline
      ></video>
      <div
        *ngIf="callType === 'audio' || (callType === 'video' && !hasRemoteVideo)"
        class="flex h-28 w-28 items-center justify-center rounded-full bg-surface-700 text-3xl font-semibold text-ink sm:h-40 sm:w-40 sm:text-4xl short:h-20 short:w-20 short:text-2xl"
      >
        {{ peerName.slice(0, 2).toUpperCase() }}
      </div>

      <video
        #localVideo
        *ngIf="callType === 'video'"
        class="absolute bottom-3 right-3 aspect-video w-24 rounded-xl border border-white/20 object-cover shadow-lg sm:bottom-4 sm:right-4 sm:w-40"
        autoplay
        playsinline
        muted
      ></video>
    </div>
  </div>

  <!-- Wraps rather than squeezing three pills into a 360px row; clears the
       home indicator. -->
  <div class="flex shrink-0 flex-wrap items-center justify-center gap-3 border-t border-surface-800 p-4 pb-[calc(1rem+var(--safe-bottom))] sm:gap-4 sm:p-6 short:p-2">
    <ng-container *ngIf="callState !== 'unavailable'; else unavailableActions">
    <button
      type="button"
      (click)="toggleMute()"
      class="rounded-full bg-surface-700 px-5 py-3 text-sm font-medium text-ink hover:bg-surface-600"
      [attr.aria-label]="muted ? 'Unmute' : 'Mute'"
    >
      {{ muted ? 'Unmute' : 'Mute' }}
    </button>
    <button
      *ngIf="callType === 'video'"
      type="button"
      (click)="toggleCam()"
      class="rounded-full bg-surface-700 px-5 py-3 text-sm font-medium text-ink hover:bg-surface-600"
      [attr.aria-label]="camOff ? 'Turn camera on' : 'Turn camera off'"
    >
      {{ camOff ? 'Camera on' : 'Camera off' }}
    </button>
    <button
      type="button"
      (click)="endCall()"
      class="rounded-full bg-danger px-6 py-3 text-sm font-medium text-ink hover:bg-danger"
      aria-label="End call"
    >
      End call
    </button>
    </ng-container>
    <ng-template #unavailableActions>
      <button
        type="button"
        (click)="endCall()"
        class="rounded-full bg-surface-700 px-6 py-3 text-sm font-medium text-ink hover:bg-surface-600"
        aria-label="Close"
      >
        Close
      </button>
    </ng-template>
  </div>
</div>
