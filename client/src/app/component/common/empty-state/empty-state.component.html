<div
  class="flex flex-col items-center justify-center text-center text-ink-secondary"
  [ngClass]="
    embedded
      ? 'mx-auto max-w-md px-4 py-6'
      : 'rounded-xl border border-surface-800 bg-surface-900/50 px-6 py-10'
  "
>
  <img *ngIf="iconSrc" [src]="iconSrc" [alt]="iconAlt || title" class="mb-4 h-16 w-16 opacity-70" />
  <h3 class="text-lg font-medium text-ink">{{ title }}</h3>
  <p *ngIf="description" class="mt-2 max-w-md text-sm">{{ description }}</p>
  <app-button *ngIf="actionLabel" variant="primary" size="sm" extraClass="mt-4" (click)="onAction()">{{ actionLabel }}</app-button>
</div>
