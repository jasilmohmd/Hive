<!-- Image Cropper Modal -->
<!-- z-[80]: above the phone nav and bottom sheets wherever it is opened from. -->
<div class="fixed inset-0 z-[80] flex items-center justify-center bg-surface-950/75 p-3 sm:p-4">
  <div class="flex w-full max-w-3xl max-h-[calc(100dvh-1.5rem)] flex-col overflow-hidden rounded-2xl bg-surface-900 p-3 sm:p-4"
    role="dialog" aria-modal="true" aria-labelledby="cropper-title">
    <h2 id="cropper-title" class="mb-2 shrink-0 text-base font-semibold text-ink">Crop image</h2>
    <div class="min-h-0 flex-1 overflow-auto">
      <image-cropper
        #cropper
        class="block w-full max-h-[60dvh]"
        [imageChangedEvent]="imageChangedEvent"
        [maintainAspectRatio]="true"
        [aspectRatio]="aspectRatio"
        [format]="format"
        (imageLoaded)="onImageLoaded()"
        (cropperReady)="onCropperReady()"
        (imageCropped)="onImageCropped($event)"
      ></image-cropper>
    </div>
    <div class="mt-3 flex shrink-0 justify-end gap-2 pb-[var(--safe-bottom)] sm:mt-4 sm:pb-0">
      <app-button variant="secondary" (click)="onCancel()">Cancel</app-button>
      <app-button variant="primary" (click)="onDone()">Done</app-button>
    </div>
  </div>
</div>
