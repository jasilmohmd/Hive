<!-- Image Cropper Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface-950/75 p-3 sm:p-4">
  <div class="flex w-full max-w-3xl max-h-[92vh] flex-col overflow-hidden rounded-lg bg-surface-900 p-3 sm:p-4">
    <div class="min-h-0 flex-1 overflow-auto">
      <image-cropper
        #cropper
        class="block w-full max-h-[68vh]"
        [imageChangedEvent]="imageChangedEvent"
        [maintainAspectRatio]="true"
        [aspectRatio]="aspectRatio"
        [format]="format"
        (imageLoaded)="onImageLoaded()"
        (cropperReady)="onCropperReady()"
        (imageCropped)="onImageCropped($event)"
      ></image-cropper>
    </div>
    <div class="mt-4 flex shrink-0 gap-2">
      <app-button variant="secondary" (click)="onCancel()">Cancel</app-button>
      <app-button variant="primary" (click)="onDone()">Done</app-button>
    </div>
  </div>
</div>
