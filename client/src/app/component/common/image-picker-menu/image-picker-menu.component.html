<div class="relative">
  <ng-container *ngIf="variant === 'avatar'">
    <!-- w-fit wrapper: the touch edit badge anchors to the avatar's corner,
         not to this component's (possibly much wider) box. -->
    <div class="relative mx-auto w-fit">
    <div
      class="relative overflow-hidden rounded-full bg-surface-800 ring-2 ring-surface-700 mx-auto"
      [ngClass]="avatarSizeClass"
    >
      <img *ngIf="src" [src]="src" [alt]="alt" class="h-full w-full object-cover" />
      <div
        *ngIf="!src"
        class="flex h-full w-full items-center justify-center bg-surface-700 text-lg font-medium text-ink-secondary md:text-2xl"
      >
        {{ fallbackLabel }}
      </div>

      <!-- Hover/focus overlay for mouse and keyboard. Touch screens can't
           hover, so they get the always-visible edit badge below instead. -->
      <div
        *ngIf="editable"
        class="absolute inset-0 flex flex-col items-center justify-center gap-1 bg-surface-950/55 opacity-0 transition-opacity hover:opacity-100 focus-within:opacity-100 hover-none:hidden"
      >
        <button
          type="button"
          class="rounded-md bg-surface-900/90 px-2 py-1 text-xs text-ink hover:bg-surface-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand disabled:opacity-50"
          [disabled]="uploading"
          (click)="triggerPick()"
        >
          Change photo
        </button>
        <button
          *ngIf="allowRemove && src"
          type="button"
          class="rounded-md px-2 py-1 text-xs text-ink-secondary underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand disabled:opacity-50"
          [disabled]="uploading"
          (click)="onRemove()"
        >
          Remove
        </button>
      </div>

      <div
        *ngIf="uploading"
        class="absolute inset-0 flex items-center justify-center bg-surface-950/65 text-xs font-medium text-ink"
      >
        Uploading…
      </div>
    </div>

    <!-- Touch: a visible edit badge (outside the round clip) that opens the
         picker. The hover overlay above is hidden on these screens. -->
    <button
      *ngIf="editable"
      type="button"
      class="absolute bottom-0 right-0 hidden h-9 w-9 translate-x-1 translate-y-1 items-center justify-center rounded-full bg-surface-700 text-ink shadow-lg ring-2 ring-surface-900 disabled:opacity-50 hover-none:inline-flex"
      [disabled]="uploading"
      (click)="triggerPick()"
      aria-label="Change photo"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    </button>
    </div>

    <div *ngIf="editable && allowRemove && src" class="mt-3 hidden justify-center hover-none:flex">
      <button
        type="button"
        class="min-h-10 rounded-lg px-3 text-sm text-ink-secondary hover:bg-surface-800 disabled:opacity-50"
        [disabled]="uploading"
        (click)="onRemove()"
      >
        Remove photo
      </button>
    </div>
  </ng-container>

  <ng-container *ngIf="variant === 'cover'">
    <div class="relative aspect-[3/1] w-full overflow-hidden rounded-xl bg-surface-800 ring-1 ring-white/10">
      <img
        *ngIf="src"
        [src]="src"
        [alt]="alt"
        class="h-full w-full object-cover"
      />
      <div
        *ngIf="!src"
        class="flex h-full w-full items-center justify-center text-sm text-ink-muted"
      >
        No cover image
      </div>

      <div
        class="pointer-events-none absolute inset-0 z-[1] rounded-xl bg-gradient-to-t from-surface-950/85 via-surface-950/15 to-transparent"
        aria-hidden="true"
      ></div>

      <div *ngIf="editable" class="absolute top-2 right-2 z-[2] sm:top-3 sm:right-3">
        <button
          type="button"
          class="rounded-full bg-surface-900/90 p-2.5 text-ink shadow-lg ring-1 ring-white/20 backdrop-blur-sm hover:bg-surface-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand disabled:opacity-50"
          [disabled]="uploading"
          (click)="triggerPick()"
          aria-label="Edit cover image"
          title="Edit cover image"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
            />
          </svg>
        </button>
      </div>

      <div
        *ngIf="uploading"
        class="absolute inset-0 z-[3] flex items-center justify-center bg-surface-950/60 text-sm font-medium text-ink"
      >
        Uploading…
      </div>
    </div>
  </ng-container>

  <input
    #fileInput
    type="file"
    accept="image/*"
    class="hidden"
    (change)="onFileChange($event)"
  />
</div>

<app-image-cropper-modal
  *ngIf="showCropper"
  [imageChangedEvent]="imageChangedEvent"
  [aspectRatio]="aspectRatio"
  format="jpeg"
  (done)="onCropDone($event)"
  (cancel)="onCropCancel()"
/>

<p *ngIf="errorMessage" class="mt-2 text-center text-xs text-danger-text" role="alert">
  {{ errorMessage }}
</p>
