<div
  *ngIf="incoming"
  class="fixed inset-0 z-[90] flex items-center justify-center bg-surface-950/70 p-4"
  role="alertdialog"
  aria-labelledby="incoming-call-title"
  aria-describedby="incoming-call-caller"
>
  <!-- z-[90]: above voiceroom theater mode (z-60) and bottom sheets (z-70),
       which used to hide an incoming call entirely. -->
  <div class="w-full max-w-sm rounded-2xl bg-surface-800 p-6 shadow-xl ring-1 ring-white/10">
    <h2 id="incoming-call-title" class="text-lg font-semibold text-ink">
      Incoming {{ callTypeLabel() }}
    </h2>
    <p id="incoming-call-caller" class="mt-2 truncate text-ink-secondary">{{ callerName }}</p>
    <p *ngIf="inVoiceroom" class="mt-3 rounded-lg bg-surface-900 px-3 py-2 text-sm text-ink-secondary">
      Accepting will leave
      <span class="font-medium text-ink">{{ activeRoomName || 'the voice room' }}</span>.
    </p>
    <div class="mt-6 flex gap-3">
      <button
        type="button"
        (click)="decline()"
        class="flex-1 rounded-xl bg-surface-700 py-3 text-sm font-medium text-ink hover:bg-surface-600 focus-visible:ring-2 focus-visible:ring-brand"
      >
        Decline
      </button>
      <button
        type="button"
        (click)="accept()"
        class="flex-1 rounded-xl bg-success py-3 text-sm font-medium text-surface-950 hover:bg-success-hover focus-visible:ring-2 focus-visible:ring-brand"
      >
        {{ inVoiceroom ? 'Leave room & accept' : 'Accept' }}
      </button>
    </div>
  </div>
</div>
