<div
  *ngIf="incoming"
  class="fixed inset-0 z-[60] flex items-center justify-center bg-surface-950/70 p-4"
  role="alertdialog"
  aria-labelledby="incoming-call-title"
>
  <div class="w-full max-w-sm rounded-2xl bg-surface-800 p-6 shadow-xl ring-1 ring-white/10">
    <h2 id="incoming-call-title" class="text-lg font-semibold text-ink">
      Incoming {{ callTypeLabel() }}
    </h2>
    <p class="mt-2 text-ink-secondary">{{ callerName }}</p>
    <div class="mt-6 flex gap-3">
      <button
        type="button"
        (click)="decline()"
        class="flex-1 rounded-xl bg-surface-700 py-3 text-sm font-medium text-ink hover:bg-surface-600"
      >
        Decline
      </button>
      <button
        type="button"
        (click)="accept()"
        class="flex-1 rounded-xl bg-success py-3 text-sm font-medium text-surface-950 hover:bg-success-hover"
      >
        Accept
      </button>
    </div>
  </div>
</div>
