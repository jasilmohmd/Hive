<!-- Phones: full-width stack sitting above the bottom nav (and the home
     indicator), not on top of it. md+: the original bottom-right corner. -->
<div
  class="pointer-events-none fixed left-4 right-4 z-[200] flex flex-col gap-2 bottom-[calc(var(--bottom-nav-h)+var(--safe-bottom)+0.75rem)] sm:left-auto sm:max-w-sm md:bottom-4"
  aria-live="polite"
  aria-relevant="additions"
>
  <div
    *ngFor="let t of (toast.toasts$ | async)"
    class="pointer-events-auto flex items-start gap-2 rounded-lg border px-4 py-3 text-sm shadow-lg animate-fadeIn"
    [ngClass]="{
      'border-success/40 bg-surface-900 text-ink': t.type === 'success',
      'border-danger/50 bg-surface-900 text-danger-text': t.type === 'error',
      'border-surface-600 bg-surface-900 text-ink': t.type === 'info'
    }"
    role="status"
  >
    <span class="min-w-0 flex-1 break-words [overflow-wrap:anywhere]">{{ t.message }}</span>
    <button
      type="button"
      class="-my-2 -mr-3 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-lg text-ink-secondary hover:bg-surface-800 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
      (click)="toast.dismiss(t.id)"
      [attr.aria-label]="'Dismiss notification'"
    >
      &times;
    </button>
  </div>
</div>
