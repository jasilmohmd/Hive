<div class="channel-chat-root relative flex h-full min-h-0 w-full flex-col bg-surface-900 text-ink-secondary">
  <app-chat-message-context-menu
    *ngIf="contextMenuMsg"
    [anchorX]="contextMenuAnchor.x"
    [anchorY]="contextMenuAnchor.y"
    [isMine]="isMine(contextMenuMsg)"
    [canEdit]="canEditMessage(contextMenuMsg)"
    (reply)="onContextReply()"
    (react)="onContextReact()"
    (forward)="onContextForward()"
    (edit)="onContextEdit()"
    (delete)="onContextDelete()"
    (dismiss)="closeContextMenu()"
  />
  <div
    *ngIf="showHeader"
    class="flex shrink-0 items-center justify-between border-b border-surface-700 bg-surface-800 p-2 md:p-4"
  >
    <div class="flex min-w-0 items-center gap-2 md:gap-3">
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-surface-700 md:h-10 md:w-10">
        <span class="text-base text-brand md:text-lg">#</span>
      </div>
      <div class="min-w-0">
        <h2 class="truncate text-sm font-semibold text-ink md:text-base" [title]="channelTitle">{{ channelTitle }}</h2>
      </div>
    </div>
  </div>

  <div
    *ngIf="!showHeader"
    class="flex shrink-0 items-center justify-between border-b border-surface-700 bg-surface-800/90 px-3 py-2"
  >
    <div class="flex min-w-0 items-center gap-2">
      <img src="assets/Icons/chat_fill.png" alt="" class="h-4 w-4 shrink-0 opacity-80" aria-hidden="true">
      <h2 class="truncate text-sm font-semibold text-ink">{{ channelTitle || 'Chat' }}</h2>
    </div>
    <button
      type="button"
      class="shrink-0 rounded p-1 hover:bg-surface-700 focus-visible:ring-2 focus-visible:ring-brand"
      aria-label="Close chat"
      (click)="onClose()"
    >
      <img src="assets/Icons/Close_round_light.png" alt="" class="h-5 w-5">
    </button>
  </div>

  <div class="px-2 pt-2 shrink-0 md:px-4">
    <app-error-alert
      *ngIf="uploadError || errorMessage"
      [message]="uploadError || errorMessage || ''"
      variant="inline"
    />
    <app-loading-state
      *ngIf="loading"
      variant="spinner"
      message="Loading messages…"
      containerClass="py-2"
    />
  </div>

  <div class="flex-1 overflow-y-auto p-2 space-y-2 min-h-0 scrollbar-themed md:p-4 md:space-y-3">
    <div
      *ngFor="let msg of messages; trackBy: trackByMsg"
      class="flex w-full py-1"
      [class.justify-end]="isMine(msg)"
      [class.justify-start]="!isMine(msg)"
    >
      <div
        class="flex max-w-[88%] gap-1.5 items-end sm:max-w-[75%] md:gap-2"
        [class.flex-row-reverse]="isMine(msg)"
      >
        <!-- 28px avatar on phones: at 40px it ate a fifth of the bubble's width. -->
        <div
          class="relative flex h-7 w-7 flex-shrink-0 overflow-hidden rounded-full ring-1 ring-white/10 md:h-10 md:w-10"
        >
          <img
            *ngIf="senderImageUrl(msg) as url"
            [src]="url"
            [alt]="senderLabel(msg)"
            class="h-full w-full object-cover"
          />
          <div
            *ngIf="!senderImageUrl(msg)"
            class="flex h-full w-full items-center justify-center text-xs font-medium"
            [ngStyle]="senderAvatarStyle(msg)"
          >
            {{ avatarInitials(msg) }}
          </div>
        </div>

        <div class="flex min-w-0 flex-col" [class.items-end]="isMine(msg)">
          <!-- min-w-0 + truncate on the name so a long username pushes the
               timestamp onto its own line instead of overflowing the bubble. -->
          <div class="mb-0.5 flex flex-wrap items-baseline gap-x-2 px-0.5 md:mb-1" *ngIf="!isMine(msg)">
            <span class="min-w-0 max-w-full truncate text-xs font-medium md:text-sm" [ngStyle]="senderNameStyle(msg)">{{
              senderName(msg) ?? 'Unknown user'
            }}</span>
            <span class="shrink-0 whitespace-nowrap text-[11px] text-ink-muted md:text-xs">{{ msg.timestamp | date : 'shortTime' }}</span>
          </div>

          <div *ngIf="isMine(msg)" class="mb-0.5 flex justify-end px-0.5 md:mb-1">
            <span class="whitespace-nowrap text-[11px] text-ink-muted md:text-xs">{{ msg.timestamp | date : 'shortTime' }}</span>
          </div>

          <div
            class="chat-bubble rounded-2xl px-3 py-1.5 text-sm whitespace-pre-wrap break-words ring-1 md:px-4 md:py-2 md:text-base"
            [ngClass]="
              isMine(msg) ? 'text-ink ring-surface-700/50' : 'text-ink ring-white/[0.06]'
            "
            [ngStyle]="messageBubbleStyle(msg)"
            (contextmenu)="openContextMenu(msg, $event)"
            appLongPress
            (longPress)="openContextMenuAt(msg, $event)"
          >
            <app-chat-message-body
              [msg]="msg"
              context="channel"
              (vote)="onVotePoll(msg, $event)"
            />
          </div>
          <app-chat-message-reactions
            [reactions]="msg.reactions ?? []"
            [showPicker]="reactionPickerMsgId === msg._id"
            (react)="onReaction(msg, $event)"
            (togglePicker)="reactionPickerMsgId = reactionPickerMsgId === msg._id ? null : (msg._id ?? null)"
          />
        </div>
      </div>
    </div>

    <app-empty-state
      *ngIf="!loading && messages.length === 0"
      title="No messages yet"
      description="Say hello to start the conversation."
    />
  </div>

  <div class="relative shrink-0">
    <input
      #imageInput
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onImageFileSelected($event)"
    />
    <input
      #videoInput
      type="file"
      accept="video/mp4,video/webm,video/quicktime"
      class="hidden"
      (change)="onVideoFileSelected($event)"
    />
    <input
      #documentInput
      type="file"
      accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip"
      class="hidden"
      (change)="onDocumentFileSelected($event)"
    />
    <app-chat-attach-menu
      *ngIf="attachMenuOpen"
      theme="channel"
      (mediaRequested)="onAttachMediaRequested()"
      (documentRequested)="onAttachDocumentRequested(documentInput)"
      (locationRequested)="onAttachLocationRequested()"
      (voiceRequested)="onAttachVoiceRequested()"
      (contactRequested)="onAttachContactRequested()"
      (pollRequested)="onAttachPollRequested()"
      (dismiss)="attachMenuOpen = false"
    />
    <app-chat-voice-recorder *ngIf="voicePanelOpen" theme="channel" (recorded)="onVoiceRecorded($event)" (dismiss)="voicePanelOpen = false" />
    <app-chat-poll-composer *ngIf="pollComposerOpen" theme="channel" (created)="onPollCreated($event)" (dismiss)="pollComposerOpen = false" />
    <app-chat-contact-picker *ngIf="contactPickerOpen" theme="channel" (picked)="onContactPicked($event)" (dismiss)="contactPickerOpen = false" />
    <app-chat-forward-picker
      *ngIf="forwardMsg"
      [currentUserId]="currentUserId"
      [excludeChatId]="channelId"
      (picked)="onForwardToChat($event)"
      (dismiss)="forwardMsg = null"
    />
    <app-chat-media-picker
      *ngIf="mediaPickerOpen"
      theme="channel"
      (photoRequested)="onMediaPhotoRequested(imageInput)"
      (videoRequested)="onMediaVideoRequested(videoInput)"
      (dismiss)="mediaPickerOpen = false"
    />
    <app-chat-location-picker
      *ngIf="locationPickerOpen"
      theme="channel"
      (picked)="onLocationPicked($event)"
      (dismiss)="locationPickerOpen = false"
    />
    <app-chat-gif-picker
      *ngIf="gifPanelOpen"
      theme="channel"
      (picked)="onGifChosen($event)"
      (dismiss)="gifPanelOpen = false"
    />
    <app-chat-gif-picker
      *ngIf="stickerPanelOpen"
      mode="sticker"
      theme="channel"
      (picked)="onStickerChosen($event)"
      (dismiss)="stickerPanelOpen = false"
    />
    <app-chat-composer
      theme="channel"
      [disabled]="!channelId"
      [busy]="loading"
      [isUploading]="isUploading"
      [resetNonce]="composerReset"
      [pendingFile]="pendingFile"
      [pendingUploadKind]="pendingUploadKind"
      [attachError]="attachError"
      [replyPreview]="replyPreviewText()"
      placeholder="Write a message..."
      (cancelReply)="cancelReply()"
      (sendRequested)="onComposerSend($event)"
      (gifPickRequested)="toggleGifPanel()"
      (stickerPickRequested)="toggleStickerPanel()"
      (attachMenuRequested)="toggleAttachMenu()"
      (clearPendingFile)="clearPendingAttach()"
    />
  </div>

  <div
    *ngIf="editingMsg"
    class="fixed inset-0 z-50 flex items-center justify-center bg-surface-950/60 p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Edit message"
  >
    <div class="w-full max-w-md rounded-2xl border border-surface-700 bg-surface-800 p-4 shadow-xl">
      <h3 class="mb-3 text-sm font-medium text-ink">Edit message</h3>
      <textarea
        class="mb-3 w-full resize-none rounded-lg border border-surface-600 bg-surface-900 px-3 py-2 text-sm text-ink focus:border-brand focus:outline-none"
        rows="4"
        [value]="editDraft"
        (input)="editDraft = $any($event.target).value"
      ></textarea>
      <div class="flex justify-end gap-2">
        <app-button variant="ghost" size="sm" (click)="cancelEdit()">Cancel</app-button>
        <app-button variant="primary" size="sm" (click)="saveEdit()">Save</app-button>
      </div>
    </div>
  </div>
</div>
