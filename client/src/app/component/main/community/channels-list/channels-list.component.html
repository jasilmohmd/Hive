<!-- General Section -->
<div class="rounded-xl bg-surface-900 w-full mb-2 p-1.5">
  <div class="text-ink-secondary font-medium px-2 py-1 text-sm">General</div>
  <div class="flex-col items-center text-ink-secondary cursor-pointer">
    <a [routerLink]="['/main','community', communityId, 'about']" class="flex items-center gap-1 hover:bg-surface-850 rounded-lg w-full px-2 py-2 md:py-0.5">
      <img src="/assets/Icons/hash.png" alt="" class="h-4 w-4">
      <span class="text-sm">About</span>
    </a>
    <div *ngFor="let item of channels.info" class="flex min-w-0 items-center gap-1 hover:bg-surface-850 rounded-lg w-full px-2 py-2 md:py-0.5" [title]="item.name">
      <img src="/assets/Icons/hash.png" alt="" class="h-4 w-4 shrink-0">
      <span class="min-w-0 truncate text-sm">{{ item.name }}</span>
    </div>
  </div>
</div>

<!-- Chat Rooms Section -->
<div *ngIf="channels.chatroom?.length" class="rounded-xl bg-surface-900 w-full mb-2 p-1.5">
  <div class="text-ink-secondary font-medium px-2 py-1 text-sm">Chat Rooms</div>
  <div *ngFor="let room of channels.chatroom" class="flex items-center text-ink-secondary cursor-pointer">
    <a [routerLink]="['/main','community', communityId, 'chatroom', room._id ]" class="flex min-w-0 items-center gap-1 hover:bg-surface-850 rounded-lg w-full px-2 py-2 md:py-0.5" [title]="room.name">
      <img src="/assets/Icons/chat_fill.png" alt="" class="h-4 w-4 shrink-0">
      <span class="min-w-0 truncate text-sm">{{ room.name }}</span>
    </a>
  </div>
</div>

<!-- Voice Rooms Section -->
<div *ngIf="channels.voiceroom?.length" class="rounded-xl bg-surface-900 w-full mb-2 flex-grow p-1.5">
  <div class="text-ink-secondary font-medium px-2 py-1 text-sm">Voice Rooms</div>
  <div *ngFor="let room of channels.voiceroom" class="mb-0.5">
    <div class="flex items-center rounded-md hover:bg-surface-850 w-full">
      <a
        [routerLink]="['/main','community', communityId, 'voiceroom', room._id ]"
        class="flex min-w-0 flex-1 items-center gap-1 px-1.5 py-2 text-ink-secondary md:gap-1.5 md:px-2 md:py-1"
        [title]="room.name"
      >
        <img src="/assets/Icons/sound_max_fill.png" alt="" class="h-4 w-4 shrink-0">
        <span class="truncate text-sm">{{ room.name }}</span>
        <!--
          Always shown again. The column went from 144px to 176px when it became
          collapsible, which leaves the name ~78px — enough for a real channel
          name — so the occupancy count no longer has to be hidden to make room,
          and it behaves the same on phone and desktop.
        -->
        <span
          class="ml-auto shrink-0 rounded bg-surface-800 px-1 py-px text-[10px] text-ink-secondary md:px-1.5"
          [class.text-success]="presenceCount(room) > 0"
        >
          {{ presenceCount(room) }}/{{ room.maxParticipants ?? 6 }}
        </span>
      </a>
      <button
        type="button"
        class="shrink-0 rounded p-1.5 hover:bg-surface-700 md:p-1"
        [attr.aria-expanded]="room.isOpen"
        [attr.aria-label]="'Participants in ' + room.name"
        (click)="toggleRoom(room, $event)"
      >
        <img
          src="/assets/Icons/small-down-arrow.png"
          alt=""
          class="h-4 w-4 transition-transform duration-200"
          [class.rotate-180]="room.isOpen"
        />
      </button>
    </div>

    <div *ngIf="room.isOpen" class="ml-3 mr-1 border-l border-surface-700/80 pl-2">
      <p *ngIf="presenceFor(room).length === 0" class="py-0.5 text-xs text-ink-muted md:text-[10px]">Empty</p>
      <div
        *ngFor="let participant of presenceFor(room)"
        class="flex items-center gap-1.5 rounded py-1.5 pr-1 hover:bg-surface-800/80 md:py-0.5"
      >
        <div class="h-6 w-6 shrink-0 overflow-hidden rounded-full bg-surface-700">
          <img
            *ngIf="participant.imageUrl; else listInitials"
            [src]="participant.imageUrl"
            [alt]="participant.userName"
            class="h-full w-full object-cover"
          />
          <ng-template #listInitials>
            <span class="flex h-full w-full items-center justify-center text-[10px] font-medium text-ink-secondary md:text-[9px]">
              {{ initials(participant.userName) }}
            </span>
          </ng-template>
        </div>
        <span class="min-w-0 flex-1 truncate text-xs text-ink-secondary">{{ participant.userName }}</span>
        <app-voiceroom-media-icons
          [muted]="participant.muted"
          [cameraOn]="participant.cameraOn"
          [screenOn]="participant.screenOn"
          [showScreen]="participant.screenOn"
          [compact]="true"
        />
      </div>
    </div>
  </div>
</div>
