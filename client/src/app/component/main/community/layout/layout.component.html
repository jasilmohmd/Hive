<app-loading-state *ngIf="isLoading" variant="skeleton" containerClass="flex h-full flex-row gap-2 rounded-2xl box-border animate-pulse md:gap-3">
  <div class="hidden h-full shrink-0 rounded-2xl bg-surface-800 md:block md:w-1/6 md:min-w-[13rem] md:max-w-[18rem]"></div>
  <div class="grow h-full bg-surface-800 rounded-2xl p-3"></div>
</app-loading-state>

<div *ngIf="errorMessage && !isLoading" class="flex h-full flex-col items-center justify-center gap-4 p-4">
  <app-error-alert
    variant="banner"
    title="Couldn't open this community"
    [message]="errorMessage"
  />
  <div class="flex flex-wrap justify-center gap-2">
    <app-button variant="secondary" (click)="retry()">Try again</app-button>
    <a
      routerLink="/main/discover"
      class="inline-flex items-center rounded-xl px-4 py-2 text-ink-secondary hover:bg-surface-850 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
    >
      Back to Discover
    </a>
  </div>
</div>

<!-- Voice-room audio outlives the voice-room page: it plays while you read
     other channels in this community. -->
<app-voiceroom-audio />

<!-- Phone drawer backdrop. -->
<div
  *ngIf="isPhone && mobileOpen && community && !isLoading && !errorMessage"
  class="fixed inset-0 z-[55] bg-surface-950/60 animate-fade-in md:hidden"
  (click)="closeDrawer()"
  aria-hidden="true"
></div>

<div
  *ngIf="community && !isLoading && !errorMessage"
  class="flex h-full min-h-0 w-full flex-row gap-2 rounded-2xl box-border md:gap-3"
>
  <!--
    Channel sidebar. Two shapes, one element:

    - md+: a column beside the content, removed from the row entirely when
      collapsed (a stub strip was just dead space). The toggle lives in the
      app shell's icon rail.
    - Phones: a slide-over drawer. As a 176px column it left the chat about
      180px wide on a 375px screen; as a drawer the chat, voice and About
      panes get the full width, and the list is one tap away in the bottom
      nav. Always rendered on phones so it can slide; `inert` + visibility
      keep it out of reach while closed.
  -->
  <aside
    *ngIf="isPhone || !sidebarCollapsed"
    id="community-channels"
    class="flex min-h-0 shrink-0 flex-col gap-1.5"
    [ngClass]="asideClasses"
    [attr.inert]="isPhone && !mobileOpen ? '' : null"
    [attr.role]="isPhone ? 'dialog' : null"
    [attr.aria-modal]="isPhone ? 'true' : null"
    aria-label="Channels"
  >
    <!-- Drawer header: phones have no icon rail, so say where you are. -->
    <div *ngIf="isPhone" class="flex items-center gap-2 rounded-2xl bg-surface-900 p-2">
      <img
        *ngIf="community.imageUrl; else drawerInitials"
        [src]="community.imageUrl"
        alt=""
        class="h-9 w-9 shrink-0 rounded-full object-cover"
      />
      <ng-template #drawerInitials>
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-surface-700 text-sm font-semibold text-ink">
          {{ initials(community.name) }}
        </span>
      </ng-template>
      <span class="min-w-0 flex-1 truncate font-display text-base font-bold text-ink">{{ community.name }}</span>
      <button
        #drawerClose
        type="button"
        class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-ink-secondary hover:bg-surface-800 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
        aria-label="Close channels"
        (click)="closeDrawer()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden rounded-2xl scrollbar-themed">
      <app-channels-list [communityId]="communityId"></app-channels-list>
    </div>

    <!-- Voice session + user controls, pinned to the bottom of the column -->
    <div class="flex shrink-0 flex-col gap-1.5">
      <app-voice-session-bar [communityId]="communityId"></app-voice-session-bar>

      <div class="flex items-center justify-between gap-2 rounded-2xl bg-surface-800 p-2 text-ink-secondary">
        <div class="flex min-w-0 items-center gap-2">
          <div class="relative shrink-0">
            <img
              *ngIf="currentUserImage; else userInitials"
              [src]="currentUserImage"
              [alt]="currentUserName + ' avatar'"
              class="h-9 w-9 rounded-full object-cover"
            />
            <ng-template #userInitials>
              <span class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-700 text-xs font-semibold text-ink" [attr.aria-label]="currentUserName + ' avatar'">
                {{ initials(currentUserName) }}
              </span>
            </ng-template>
            <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-surface-800 bg-success" aria-hidden="true"></div>
          </div>
          <div class="flex min-w-0 flex-col leading-tight">
            <span class="truncate text-sm font-medium text-ink">{{ currentUserName }}</span>
            <span class="truncate text-xs text-ink-muted">{{ voiceSessionActive ? 'In voice' : 'Online' }}</span>
          </div>
        </div>

        <div class="flex shrink-0 items-center gap-0.5">
          <!-- Mic / deafen only mean something inside a voice room. -->
          <ng-container *ngIf="voiceSessionActive">
            <button
              type="button"
              class="cl-user-btn focus-visible:ring-2 focus-visible:ring-brand"
              [class.cl-user-btn--off]="localMuted"
              [attr.aria-pressed]="localMuted"
              [attr.aria-label]="localMuted ? 'Unmute microphone' : 'Mute microphone'"
              [title]="localMuted ? 'Unmute' : 'Mute'"
              (click)="toggleMute()"
            >
              <svg *ngIf="!localMuted" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8" />
                <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <svg *ngIf="localMuted" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 10.5V6a3 3 0 0 0-5.8-1.1M9 9v2a3 3 0 0 0 4.6 2.5M5.5 11a6.5 6.5 0 0 0 10.4 5.2M18.5 11a6.4 6.4 0 0 1-.6 2.7M12 17.5V21M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <button
              type="button"
              class="cl-user-btn focus-visible:ring-2 focus-visible:ring-brand"
              [class.cl-user-btn--off]="deafened"
              [attr.aria-pressed]="deafened"
              [attr.aria-label]="deafened ? 'Undeafen' : 'Deafen'"
              [title]="deafened ? 'Undeafen' : 'Deafen'"
              (click)="toggleDeafen()"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 15v-3a8 8 0 0 1 16 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <rect x="3.5" y="14" width="4.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.8" />
                <rect x="16" y="14" width="4.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.8" />
                <path *ngIf="deafened" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </ng-container>
          <a
            [routerLink]="['/main', 'community', communityId, 'about']"
            class="cl-user-btn focus-visible:ring-2 focus-visible:ring-brand"
            aria-label="Community settings"
            title="Community settings"
          >
            <img src="assets/Icons/settings.png" alt="" class="h-5 w-5" />
          </a>
        </div>
      </div>
    </div>
  </aside>

  <!-- Scrolls for content pages (About); the chat and voice views are
       flex-sized to exactly fill it and manage their own scrolling. -->
  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto overflow-x-hidden overscroll-contain rounded-2xl bg-surface-900 scrollbar-themed">
    <router-outlet></router-outlet>
  </div>
</div>
