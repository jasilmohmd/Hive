<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-surface-950/60 backdrop-blur-sm animate-fade-in" (click)="closeModal()" aria-hidden="true"></div>

  <!-- Never taller than the visible screen; the body below scrolls. (It used
       to be overflow-hidden, so a long member list or the channel form's
       role checkboxes were simply cut off.) -->
  <div class="relative flex max-h-[calc(100dvh-2rem)] w-full max-w-lg flex-col rounded-2xl bg-surface-800 p-4 shadow-2xl sm:p-6"
    role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">

    <!-- Header with refined styling -->
    <div class="flex shrink-0 justify-between items-center gap-2 pb-3 mb-3 border-b border-surface-700/80 sm:pb-4 sm:mb-4">
      <!-- Title Section -->
      <div class="flex-1 min-w-0">
        <h2 [id]="titleId" class="text-lg font-medium text-ink tracking-tight truncate sm:text-xl">
          {{ isCreating ? (mode === 'edit' ? 'Edit ' + title : 'Create ' + title) :( isAdding ? title : 'Manage ' + title + "s" ) }}
        </h2>
      </div>

      <!-- Action Buttons -->
      <div class="flex shrink-0 items-center gap-1.5">
        <button type="button" *ngIf="addAction && !isCreating" (click)="startCreate()" class="flex min-h-10 items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-success bg-success/20 rounded-lg
                   hover:bg-success/60 transition-all duration-200
                   ring-1 ring-success/50 hover:ring-success/80
                   active:scale-[0.98]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>{{ addAction.label }}</span>
        </button>

        <button type="button" (click)="closeModal()" aria-label="Close" class="inline-flex h-10 w-10 items-center justify-center text-ink-muted hover:text-ink-secondary rounded-full hover:bg-surface-700/40
                   transition-colors duration-150 active:scale-95
                   focus:outline-none focus:ring-2 focus:ring-brand/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Form/Table Container with smooth height transition -->
    <div class="-mx-1 min-h-0 flex-1 overflow-y-auto overscroll-contain px-1 scrollbar-themed">
      <div *ngIf="isCreating; else tableView" class="animate-fade-in-up">
        <form [formGroup]="createForm" (ngSubmit)="saveNewItem()" class="space-y-4">
          <ng-container *ngFor="let field of createFields">
            <ng-container *ngIf="!field.showIf || (createForm && field.showIf(createForm.value))">
              <div class="relative group">
                <label [attr.for]="field.type === 'checkbox' ? null : 'lm-' + field.field" class="block text-ink-secondary mb-2 font-medium text-sm transition-all duration-200
                             group-focus-within:text-brand">
                  {{ field.label }}
                </label>
                <ng-container [ngSwitch]="field.type">
                  <!-- Select Field -->
                  <ng-container *ngSwitchCase="'select'">
                    <select [id]="'lm-' + field.field" formControlName="{{ field.field }}" class="w-full px-4 py-2.5 bg-surface-900 rounded-lg text-ink focus:outline-none 
                                   focus:ring-2 focus:ring-brand border border-surface-700 hover:border-surface-600
                                   transition-all duration-200 shadow-sm">
                      <option *ngFor="let option of field.options" [value]="option.value">
                        {{ option.label }}
                      </option>
                    </select>
                  </ng-container>

                  <!-- Checkbox Field -->
                  <ng-container *ngSwitchCase="'checkbox'">
                    <!-- Each option is a <label>, so the whole chip is the tap target,
                         not just the 14px box. -->
                    <div class="flex flex-wrap gap-2" role="group" [attr.aria-label]="field.label">
                      <label *ngFor="let option of field.options" class="inline-flex min-h-10 max-w-full cursor-pointer items-center gap-2 rounded-lg border border-surface-700 px-3 py-1.5
                hover:bg-surface-900/40 transition-colors"
                        [class.opacity-60]="option.disabled">
                        <input type="checkbox" [value]="option.value" (change)="onCheckboxChange($event, field.field)"
                          [checked]="isChecked(field.field, option.value)" [disabled]="option.disabled" class="h-4 w-4 shrink-0 text-brand bg-surface-800 border-surface-600 rounded-sm
                    focus:ring-1 focus:ring-brand focus:ring-offset-1 focus:ring-offset-surface-800">
                        <span class="min-w-0 truncate text-sm text-ink-secondary tracking-tight">
                          {{ option.label }}
                        </span>
                      </label>
                    </div>
                  </ng-container>

                  <!-- Default Input Field -->
                  <ng-container *ngSwitchDefault>
                    <input [id]="'lm-' + field.field" [type]="field.type || 'text'" formControlName="{{ field.field }}"
                      placeholder="{{ field.label }}" class="w-full px-4 py-2.5 bg-surface-900 rounded-lg text-ink placeholder-ink-muted 
                                  focus:outline-none focus:ring-2 focus:ring-brand border border-surface-700
                                  hover:border-surface-600 transition-all duration-200 shadow-sm">
                  </ng-container>
                </ng-container>

                <!-- In the flow, not absolutely positioned: a two-line message used
                     to sit on top of the next field. (It also carried an
                     @slideInOut trigger with no animations provider registered,
                     which threw NG05105 the moment a field went invalid.) -->
                <div *ngIf="createForm.get(field.field)?.touched && createForm.get(field.field)?.invalid"
                  class="mt-1 text-danger-text text-sm font-medium animate-fade-in" role="alert">
                  {{ getErrorMessage(field.field) }}
                </div>
              </div>
            </ng-container>
          </ng-container>

          <!-- Form Buttons -->
          <div class="flex flex-wrap gap-3 pt-2">
            <app-button type="submit" variant="primary">Save</app-button>
            <app-button variant="secondary" (click)="cancelCreate()">Cancel</app-button>
          </div>
        </form>
      </div>

      <ng-template #tableView>
        <div class="animate-fade-in">
          <!-- Search Input -->
          <div class="mb-4 relative group">
            <input type="search" [(ngModel)]="searchQuery" (ngModelChange)="searchChange.emit($event)" placeholder="Search..." aria-label="Search" class="w-full px-4 py-2.5 bg-surface-900 rounded-lg text-ink placeholder-ink-muted 
                          focus:outline-none focus:ring-2 focus:ring-brand border border-surface-700
                          hover:border-surface-600 transition-all duration-200 shadow-sm">
            <svg class="absolute right-3 top-3.5 w-5 h-5 text-ink-muted group-focus-within:text-brand
                       transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>

          <!-- Table -->
          <app-common-table [data]="filteredData" [columns]="columns" [primaryActions]="primaryActions"
            [secondaryActions]="secondaryActions" [showFallbackInitial]="showFallbackInitial" (itemAction)="handleAction($event)"
            class="animate-fade-in-up">
          </app-common-table>
        </div>
      </ng-template>
    </div>
  </div>
</div>
