<!-- Modal backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-surface-950/60" (click)="onCancel()" aria-hidden="true"></div>

  <!-- Modal content. Capped to the visible screen and scrolling: steps one and
       two are 620-730px tall, and on a phone (or with the keyboard up) the top
       and bottom used to be cut off with no way to reach them. -->
  <div
    class="relative w-full max-w-lg max-h-[calc(100dvh-2rem)] overflow-y-auto overscroll-contain rounded-2xl bg-surface-800 p-4 shadow-lg scrollbar-themed sm:p-6"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-community-title"
  >

    <app-loading-state *ngIf="isSubmitting" variant="overlay" [message]="overlayMessage" />

    <div class="mb-4 flex items-start justify-between gap-2">
      <h2 id="create-community-title" class="text-xl font-semibold text-ink sm:text-2xl">Create Community</h2>
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSubmitting"
        aria-label="Close create community dialog"
        class="-m-2 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg hover:bg-surface-700 focus-visible:ring-2 focus-visible:ring-brand disabled:opacity-50"
      >
        <img src="/assets/Icons/Close_round_light.png" class="h-6 w-6" alt="" />
      </button>
    </div>

    <app-error-alert
      *ngIf="submitError"
      variant="inline"
      [message]="submitError"
      class="mb-4 block"
    />

    <div class="relative pt-2">
      <div class="absolute inset-0 flex items-center" aria-hidden="true">
        <div class="w-full border-t border-surface-700"></div>
      </div>
      <div class="relative flex justify-center">
        <span class="px-3 bg-surface-800 text-sm text-ink-secondary">
          Step {{ currentStep }} of 3
        </span>
      </div>
    </div>

    <div class="flex justify-center mt-3 mb-6" aria-hidden="true">
      <div class="flex items-center gap-2">
        <div *ngFor="let step of [1,2,3]"
          [class]="'w-3 h-3 rounded-full ' + (currentStep === step ? 'bg-brand' : 'bg-surface-600')">
        </div>
      </div>
    </div>

    <!-- Multi-step wizard using ngIf -->
    <div *ngIf="currentStep === 1">
      <community-create-step-one [formGroup]="communityForm" (next)="goToStep(2)">
      </community-create-step-one>
    </div>

    <div *ngIf="currentStep === 2">
      <community-create-step-two [formGroup]="communityForm" (next)="goToStep(3)" (back)="goToStep(1)">
      </community-create-step-two>
    </div>

    <div *ngIf="currentStep === 3">
      <community-create-step-three [formGroup]="communityForm" (back)="goToStep(2)" (submit)="onSubmit()">
      </community-create-step-three>
    </div>
  </div>
</div>
