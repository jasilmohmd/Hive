<div class="flex min-h-0 flex-1 flex-col">
  <p class="mb-3 text-sm text-ink-secondary">Find people by their Hive username.</p>

  <input
    type="search"
    placeholder="Enter username…"
    class="min-h-10 w-full rounded-2xl bg-surface-700 px-4 py-2 text-ink placeholder-ink-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-brand"
    [(ngModel)]="searchTerm"
    (input)="onSearchTermChange()"
    aria-label="Search by username"
    autocomplete="off"
    autocapitalize="off"
  />

  <div class="relative mt-3 flex min-h-0 flex-1 flex-col">
    <app-loading-state *ngIf="isLoading" variant="spinner" message="Searching…" containerClass="py-8" />

    <ng-container *ngIf="!isLoading">
      <div *ngIf="hasSearched && searchResults.length === 0" class="flex min-h-0 flex-1 items-center justify-center p-6">
        <app-empty-state
          [embedded]="true"
          title="No users found"
          description="Try another username."
        />
      </div>
      <app-common-table
        *ngIf="searchResults.length"
        [data]="searchResults"
        [columns]="tableColumns"
        [primaryActions]="primaryActions"
        appearance="friends"
        [showColumnHeaders]="false"
        ariaLabel="Search results"
      >
      </app-common-table>
    </ng-container>
  </div>
</div>
