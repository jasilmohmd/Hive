<div class="bg-surface-900 rounded-2xl p-2 sm:p-4 md:p-5 h-full flex flex-col">
  <!-- One row that scrolls sideways on phones, rather than five pills
       wrapping onto two rows and pushing the list down. -->
  <div class="mb-2 shrink-0 rounded-2xl bg-surface-700 p-2 sm:mb-3 sm:p-3 md:p-4">
    <nav class="-m-1 flex flex-nowrap gap-2 overflow-x-auto p-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="Friends sections">
      <a
        routerLink="/main/friends_section/friends"
        routerLinkActive="!bg-brand !text-surface-950"
        [routerLinkActiveOptions]="{ exact: true }"
        class="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap px-3 md:px-4 py-2 bg-surface-600 text-sm rounded-xl transition-colors hover:bg-surface-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-surface-700"
      >
        Friends
      </a>
      <a
        routerLink="/main/friends_section/online"
        routerLinkActive="!bg-brand !text-surface-950"
        class="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap px-3 md:px-4 py-2 bg-surface-600 text-sm rounded-xl transition-colors hover:bg-surface-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-surface-700"
      >
        Online
      </a>
      <a
        routerLink="/main/friends_section/pending"
        routerLinkActive="!bg-brand !text-surface-950"
        class="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap px-3 md:px-4 py-2 bg-surface-600 text-sm rounded-xl transition-colors hover:bg-surface-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-surface-700"
      >
        Pending
      </a>
      <a
        routerLink="/main/friends_section/blocked"
        routerLinkActive="!bg-brand !text-surface-950"
        class="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap px-3 md:px-4 py-2 bg-surface-600 text-sm rounded-xl transition-colors hover:bg-surface-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-surface-700"
      >
        Blocked
      </a>
      <a
        routerLink="/main/friends_section/addfriend"
        routerLinkActive="!bg-success !text-surface-950"
        class="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap px-3 md:px-4 py-2 bg-surface-600 text-sm rounded-xl transition-colors hover:bg-surface-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-success focus-visible:ring-offset-2 focus-visible:ring-offset-surface-700"
      >
        Add Friend
      </a>
    </nav>
  </div>

  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto overflow-x-hidden">
    <router-outlet></router-outlet>
  </div>
</div>
