<app-common-modal
  *ngIf="confirmModalVisible"
  [title]="pendingAction?.type === 'unfriend' ? 'Remove friend?' : 'Block user?'"
  variant="destructive"
  [confirmText]="pendingAction?.type === 'unfriend' ? 'Remove' : 'Block'"
    [message]="
    pendingAction?.type === 'unfriend'
      ? 'They will be removed from your friends list.'
      : 'They won\'t be able to message you or send you friend requests.'
  "
  (confirmed)="handleConfirmation()"
  (cancelled)="cancelConfirmation()"
>
</app-common-modal>

<div class="shrink-0 bg-surface-900 pb-2">
  <input
    type="search"
    placeholder="Search online friends…"
    [(ngModel)]="searchTerm"
    (input)="searchOnlineFriends()"
    aria-label="Search online friends"
    class="min-h-10 w-full rounded-2xl bg-surface-700 px-4 py-2 text-ink placeholder-ink-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-brand"
  />
</div>

<app-loading-state *ngIf="loading" variant="spinner" message="Loading…" containerClass="py-8" />

<app-error-alert *ngIf="errorMessage && !loading" [message]="errorMessage" variant="inline" class="mb-2 block" />

<!-- Empty and no-match states show whether or not you've searched; they used
     to appear only after typing, leaving a blank panel on first visit. -->
<div *ngIf="!loading" class="flex min-h-0 flex-1 flex-col">
  <div *ngIf="filteredOnlineFriends.length === 0 && !errorMessage" class="flex min-h-0 flex-1 items-center justify-center p-6">
    <app-empty-state
      [embedded]="true"
      [title]="searchTerm.trim() ? 'No matches' : 'Nobody is online'"
      [description]="searchTerm.trim() ? 'Try a different search term.' : 'Friends who are online right now show up here.'"
    />
  </div>
  <app-common-table
    *ngIf="filteredOnlineFriends.length"
    [data]="filteredOnlineFriends"
    [columns]="tableColumns"
    [primaryActions]="primaryActions"
    [secondaryActions]="secondaryActions"
    appearance="friends"
    [showColumnHeaders]="false"
    ariaLabel="Online friends"
    [enableRowClick]="true"
    (rowClick)="message($event)"
  >
  </app-common-table>
</div>
