<div class="bg-surface-950 m-0 min-h-screen overflow-y-auto flex flex-col md:flex-row">

  <app-incoming-call-modal></app-incoming-call-modal>

  <create-community-layout *ngIf="showCommunityCreateModal" (close)="toggleCommunityCreateModal()"></create-community-layout>

  <!-- Mobile bottom nav -->
  <nav
    class="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around border-t border-surface-800 bg-surface-900 px-2 py-2 md:hidden"
    aria-label="Primary"
  >
    <a
      routerLink="/main/friends_section/friends"
      routerLinkActive="opacity-100 ring-2 ring-brand"
      [routerLinkActiveOptions]="{ exact: false }"
      class="rounded-full p-2 opacity-90"
      [attr.aria-label]="'Friends and messages'"
    >
      <img src="assets/images/Logo-bg-white.png" alt="" class="h-10 w-10 rounded-full object-cover" />
    </a>
    <a
      routerLink="/main/discover"
      routerLinkActive="opacity-100 ring-2 ring-brand"
      class="rounded-full bg-surface-700 p-3"
      aria-label="Discover communities"
    >
      <img src="assets/Icons/compass-fill.png" alt="" class="h-8 w-8" />
    </a>
    <button
      type="button"
      (click)="toggleCommunityCreateModal()"
      class="rounded-full bg-surface-700 p-3 hover:bg-surface-700 focus-visible:ring-2 focus-visible:ring-brand"
      aria-label="Create community"
    >
      <img src="assets/Icons/plus.png" alt="" class="h-8 w-8" />
    </button>

    <!-- Channel sidebar toggle. Lives here rather than in the sidebar so that
         hiding the sidebar leaves no stub behind. Community routes only. -->
    <button
      *ngIf="inCommunity"
      type="button"
      (click)="toggleChannelSidebar()"
      class="rounded-full p-3 focus-visible:ring-2 focus-visible:ring-brand"
      [class.bg-surface-700]="!channelSidebarCollapsed"
      [class.text-ink]="!channelSidebarCollapsed"
      [class.text-ink-muted]="channelSidebarCollapsed"
      [attr.aria-pressed]="!channelSidebarCollapsed"
      [attr.aria-label]="channelSidebarCollapsed ? 'Show channels' : 'Hide channels'"
      [title]="channelSidebarCollapsed ? 'Show channels' : 'Hide channels'"
    >
      <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7" />
        <path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.7" />
      </svg>
    </button>
  </nav>

  <!-- Vertical Navigation Bar (tablet+) -->
  <nav class="hidden md:flex bg-surface-900 max-w-20 max-h-screen p-3 mx-3 my-4 rounded-3xl overflow-y-auto box-border flex-col" aria-label="Primary">
    <div class="flex flex-col justify-between h-full">
      <ul class="text-ink space-y-4">
        <li>
          <div class="mt-2 flex justify-center">
            <a
              routerLink="/main/friends_section/friends"
              routerLinkActive="ring-2 ring-brand rounded-full"
              [routerLinkActiveOptions]="{ exact: false }"
              class="rounded-full"
              [attr.aria-label]="'Friends'"
            >
              <img src="assets/images/Logo-bg-white.png" alt="" class="w-14 h-14 rounded-full flex items-center justify-center object-cover" />
            </a>
          </div>
        </li>

        <li *ngFor="let community of communities">
          <div class="mt-2 flex justify-center">
            <a [routerLink]="['/main','community', community._id]" routerLinkActive="ring-2 ring-brand rounded-full" class="rounded-full">
              <img
                [src]="getSafeUrl(community.imageUrl)"
                [alt]="(community.name || 'Community') + ' icon'"
                class="w-14 h-14 rounded-full flex items-center justify-center object-cover"
              />
            </a>
          </div>
        </li>

        <li>
          <div class="mt-2 flex justify-center">
            <button
              type="button"
              (click)="toggleCommunityCreateModal()"
              class="bg-surface-700 text-xs p-3 rounded-full flex items-center justify-center hover:bg-surface-700 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
              aria-label="Create community"
            >
              <img src="assets/Icons/plus.png" alt="" class="w-8 h-8" />
            </button>
          </div>
        </li>
      </ul>

      <div class="mt-4 flex flex-col items-center gap-3">
        <!-- Same control as the phone bottom bar; see that comment. -->
        <button
          *ngIf="inCommunity"
          type="button"
          (click)="toggleChannelSidebar()"
          class="flex items-center justify-center rounded-full p-3 focus-visible:ring-2 focus-visible:ring-brand"
          [class.bg-surface-700]="!channelSidebarCollapsed"
          [class.text-ink]="!channelSidebarCollapsed"
          [class.text-ink-muted]="channelSidebarCollapsed"
          [attr.aria-pressed]="!channelSidebarCollapsed"
          [attr.aria-label]="channelSidebarCollapsed ? 'Show channels' : 'Hide channels'"
          [title]="channelSidebarCollapsed ? 'Show channels' : 'Hide channels'"
        >
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7" />
            <path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </button>

        <a
          routerLink="/main/discover"
          routerLinkActive="ring-2 ring-brand rounded-full"
          class="bg-surface-700 text-xs p-3 rounded-full flex items-center justify-center hover:bg-surface-700 hover:text-ink focus-visible:ring-2 focus-visible:ring-brand"
          aria-label="Discover communities"
        >
          <img src="assets/Icons/compass-fill.png" alt="" class="w-8 h-8" />
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <!-- px-1 on phones: the old pl-1/pr-4 spent 20px of a 390px screen on gutters
       that the channel sidebar and chat pane both needed. -->
  <!-- h-screen at every width, not just md. With h-auto below md this column
       had no definite height, so the community layout's h-full sidebar and chat
       pane collapsed to their content and left dead space under the composer. -->
  <div class="flex-1 flex flex-col px-1 py-2 pb-20 text-ink overflow-hidden h-screen md:pl-1 md:pr-4 md:py-4 md:pb-4">
    <!-- h-20 was a fixed 80px band above every page; on a phone that is a tenth
         of the viewport spent on a title. -->
    <header class="flex justify-between items-center gap-2 h-12 px-2 shrink-0 md:h-20 md:p-3">
      <h1 class="min-w-0 truncate text-lg font-bold md:text-3xl">{{ pageTitle }}</h1>
      <div class="flex shrink-0 items-center gap-4">
        <span class="cursor-pointer hover:text-ink-secondary hidden sm:inline">Settings</span>
        <!-- inline-flex + min-h keeps this a real 36px tap target; it was 24px. -->
        <a routerLink="/main/profile" routerLinkActive="text-brand" class="inline-flex min-h-[2.25rem] items-center rounded px-2 text-sm cursor-pointer hover:text-ink-secondary focus-visible:ring-2 focus-visible:ring-brand md:text-base">
          Profile
        </a>
      </div>
    </header>

    <!-- `relative` is the positioning context the community layout pins itself
         to. Deliberately still a block box: every routed page shares this
         wrapper, and turning it into a flex row would shrink the ones that
         don't set a host width. -->
    <div class="relative flex-1 rounded-2xl box-border overflow-hidden min-h-0">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
