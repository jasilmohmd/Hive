<!-- Success feedback comes from the page that did the work (a toast); this
     page used to add a second toast and a banner of its own on top. -->
<div class="bg-surface-900 text-ink rounded-2xl p-4 sm:p-6 max-w-lg w-full mx-auto">
  <div class="text-center mb-8">
    <h2 class="text-2xl sm:text-3xl font-bold mb-2">Profile</h2>
    <p class="text-ink-secondary">Manage your account details</p>
  </div>

  <div class="mb-8 flex justify-center">
    <app-image-picker-menu
      variant="avatar"
      [src]="userData.imageUrl ?? null"
      [editable]="true"
      [allowRemove]="true"
      [alt]="(userData.userName || 'User') + ' profile photo'"
      [fallbackLabel]="avatarInitials"
      avatarSizeClass="h-28 w-28"
      (uploaded)="onAvatarUploaded($event)"
      (removed)="onAvatarRemoved()"
    />
  </div>

  <div class="space-y-6">
    <div>
      <h3 class="text-ink-secondary text-sm">Username</h3>
      <p class="break-words text-lg font-medium">{{ userData.userName || '…' }}</p>
    </div>
    <div>
      <h3 class="text-ink-secondary text-sm">Email</h3>
      <p class="break-all text-lg font-medium">{{ userData.email || '…' }}</p>
    </div>
  </div>

  <div class="flex flex-wrap gap-3 mt-6">
    <a
      routerLink="/main/edit_profile"
      class="inline-flex min-h-10 items-center rounded-xl bg-brand px-4 py-2 text-sm font-medium text-surface-950 hover:bg-brand-hover focus-visible:ring-2 focus-visible:ring-brand"
    >
      Edit Profile
    </a>
    <a
      routerLink="/main/change_password"
      class="inline-flex min-h-10 items-center rounded-xl bg-surface-700 px-4 py-2 text-sm text-ink hover:bg-surface-600 focus-visible:ring-2 focus-visible:ring-brand"
    >
      Change Password
    </a>
  </div>

  <div class="mt-6">
    <app-button variant="danger" [loading]="logoutSubmitting" (click)="logout()"> Logout </app-button>
  </div>

  <p *ngIf="errorMessage" class="mt-4 text-danger-text text-sm">{{ errorMessage }}</p>
</div>
