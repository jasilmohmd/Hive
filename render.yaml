services:
  - type: web
    name: hive-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Optional: comma-separated host suffixes to also allow (e.g. Cloudflare
      # Pages preview deploys). Leave unset to allow only the exact CORS_ORIGIN.
      - key: CORS_ORIGIN_SUFFIXES
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Optional TURN relay for DM WebRTC calls behind strict NAT / corporate
      # Wi-Fi. Without it calls fall back to STUN only and may fail to connect.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
